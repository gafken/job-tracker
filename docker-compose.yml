services:
  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    container_name: jobtracker-backend
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
    container_name: jobtracker-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped
