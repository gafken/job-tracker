services:
  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    container_name: jobtracker-backend
    env_file:
      - .env
    environment:
      - JOBTRACKER_DB_PATH=/data/jobtracker.db
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - appnet
    volumes:
      - backend-data:/data

  frontend:
    build:
      context: ./Frontend
    container_name: jobtracker-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - appnet

volumes:
  backend-data:

networks:
  appnet:
    driver: bridge
